[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "industry-resilience"
version = "0.1.0"
description = "Comparative research on economic shocks and industry resilience"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
dependencies = ["duckdb>=1.1", "PyYAML>=6.0", "pandas>=2.2", "numpy>=1.26", "pyarrow>=18", "scipy>=1.14", "statsmodels>=0.14", "scikit-learn>=1.5", "streamlit>=1.40", "plotly>=5.24", "jupyterlab>=4.3"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13", "types-PyYAML>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/industry_resilience"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["src/industry_resilience"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
